# /etc/nginx/sites-available/app.ta-vo.jp
# After placing this file: sudo ln -s /etc/nginx/sites-available/app.ta-vo.jp /etc/nginx/sites-enabled/
# Then: sudo certbot --nginx -d app.ta-vo.jp -d ta-vo.jp

# Redirect apex to app subdomain (optional)
server {
    listen 80;
    listen [::]:80;
    server_name ta-vo.jp;
    return 301 https://app.ta-vo.jp$request_uri;
}

# HTTP -> HTTPS redirect for app subdomain
server {
    listen 80;
    listen [::]:80;
    server_name app.ta-vo.jp;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.ta-vo.jp;

    # ssl_certificate / ssl_certificate_key are managed by certbot
    # ssl_certificate     /etc/letsencrypt/live/app.ta-vo.jp/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.ta-vo.jp/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload size (videos)
    client_max_body_size 200M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Proxy to Node app
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}

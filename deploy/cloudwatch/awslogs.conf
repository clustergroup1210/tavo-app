# /etc/awslogs/awslogs.conf
# Amazon CloudWatch Logs エージェント設定例
# インストール後: sudo systemctl enable --now awslogsd

[general]
state_file = /var/lib/awslogs/agent-state

# systemd の journal を CloudWatch Logs に転送
[/var/log/tavo/app]
file = /var/log/syslog
log_group_name = /tavo/app
log_stream_name = {instance_id}/app
datetime_format = %b %d %H:%M:%S

# PM2 を使う場合は PM2 のログを直接転送
[/var/log/tavo/pm2-out]
file = /var/log/tavo/out.log
log_group_name = /tavo/app
log_stream_name = {instance_id}/stdout

[/var/log/tavo/pm2-err]
file = /var/log/tavo/error.log
log_group_name = /tavo/app
log_stream_name = {instance_id}/stderr

# nginx のアクセスログ・エラーログ
[/var/log/nginx/access]
file = /var/log/nginx/access.log
log_group_name = /tavo/nginx
log_stream_name = {instance_id}/access

[/var/log/nginx/error]
file = /var/log/nginx/error.log
log_group_name = /tavo/nginx
log_stream_name = {instance_id}/error
